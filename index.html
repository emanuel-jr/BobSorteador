<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bob Sorteador</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #0F1219;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(249,215,28,.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,150,255,.05) 0%, transparent 40%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-x: hidden;
    }

    .layout {
      width: 100%;
      max-width: 900px;
      min-height: 600px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .layout { grid-template-columns: 1fr 350px; }
    }

    /* ── MAIN CARD ── */
    .main-card {
      position: relative;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 32px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }

    @media (min-width: 768px) { .main-card { padding: 3rem; } }

    .bubble-1, .bubble-2 {
      position: absolute;
      border: 2px solid rgba(255,255,255,.1);
      border-radius: 50%;
      pointer-events: none;
    }
    .bubble-1 { width: 150px; height: 150px; right: 20px; top: 40px; }
    .bubble-2 { width: 80px;  height: 80px;  right: 185px; top: 125px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: #F9D71C;
      color: #0F1219;
      padding: .375rem 1rem;
      border-radius: 9999px;
      font-size: .75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 1.5rem;
    }

    .episode-area {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .episode-meta {
      font-size: 1rem;
      color: #F9D71C;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .15em;
      margin-bottom: .5rem;
    }

    .episode-title {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      max-width: 500px;
    }

    .empty-msg {
      color: rgba(255,255,255,.6);
      font-size: 1.125rem;
    }

    /* fade-in animation */
    @keyframes fadeZoom {
      from { opacity: 0; transform: scale(.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    .animate-in { animation: fadeZoom .3s ease forwards; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      padding: 1rem 2rem;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background .15s, opacity .15s;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }

    .btn-primary { background: #F9D71C; color: #0F1219; }
    .btn-primary:hover { background: #e5c518; }

    .btn-secondary { background: #fff; color: #0F1219; }
    .btn-secondary:hover { background: #e5e5e5; }

    /* ── SIDEBAR ── */
    .sidebar { display: flex; flex-direction: column; gap: 1.25rem; }

    .panel {
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .panel-title {
      font-size: .75rem;
      font-weight: 600;
      color: rgba(255,255,255,.6);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 1rem;
    }

    .history-list { list-style: none; display: flex; flex-direction: column; }

    .history-item {
      padding: .75rem 0;
      border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }
    .history-item:last-child { border-bottom: none; }

    .history-item-title { font-size: .9375rem; font-weight: 500; }
    .history-item-meta  { font-size: .75rem; color: rgba(255,255,255,.6); }

    .empty-history { font-size: .875rem; color: rgba(255,255,255,.4); font-style: italic; padding: .75rem 0; }

    .total-count {
      font-size: 2rem;
      font-weight: 700;
    }
    .total-count span { font-size: .875rem; font-weight: 400; color: rgba(255,255,255,.6); }

    /* SVG icons */
    svg { flex-shrink: 0; }
  </style>
</head>

</div>

// ── DOM refs ──
const episodeArea = document.getElementById('episodeArea');
const watchBtn    = document.getElementById('watchBtn');
const historyList = document.getElementById('historyList');
const totalCount  = document.getElementById('totalCount');

// ── State ──
let history = [];

// ── Init ──
totalCount.innerHTML = `${episodes.length} <span>Episódios</span>`;

// ── Logic ──
function pickRandom() {
  const idx      = Math.floor(Math.random() * episodes.length);
  const selected = episodes[idx];

  // Update episode display with animation
  episodeArea.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'animate-in';
  wrapper.innerHTML = `
    <div class="episode-meta">${selected.season} &bull; ${selected.episode}</div>
    <h1 class="episode-title">${selected.title}</h1>
  `;
  episodeArea.appendChild(wrapper);

  // Update watch button
  watchBtn.href = selected.link;
  watchBtn.style.display = 'inline-flex';

  // Update history (unique titles, max 4)
  history = [selected, ...history];
  const seen = new Set();
  history = history.filter(ep => {
    if (seen.has(ep.title)) return false;
    seen.add(ep.title);
    return true;
  }).slice(0, 4);

  renderHistory();
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<li class="empty-history">Nenhum episódio sorteado ainda.</li>';
    return;
  }
  historyList.innerHTML = history.map(ep => `
    <li class="history-item animate-in">
      <span class="history-item-title">${ep.title}</span>
      <span class="history-item-meta">${ep.season} &bull; ${ep.episode}</span>
    </li>
  `).join('');
}
</script>
